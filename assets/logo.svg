<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mdcovergen logo">
  <!-- MiniDisc cartridge: square body with the signature diagonal corner notch -->
  <path d="M114 76 H352 L426 150 V408 Q426 436 398 436 H114 Q86 436 86 408 V104 Q86 76 114 76 Z" fill="#334155"/>
  <!-- shutter slot -->
  <rect x="126" y="112" width="150" height="18" rx="9" fill="#1E293B"/>
  <!-- label: the designed inlay sitting on the cartridge -->
  <rect x="126" y="170" width="196" height="236" rx="12" fill="#F8FAFC"/>
  <clipPath id="lbl"><rect x="126" y="170" width="196" height="236" rx="12"/></clipPath>
  <!-- spine stripe -->
  <rect x="126" y="170" width="40" height="236" fill="#F59E0B" clip-path="url(#lbl)"/>
  <!-- typographic lines: artist / album -->
  <rect x="186" y="214" width="112" height="16" rx="8" fill="#0F172A"/>
  <rect x="186" y="246" width="76" height="16" rx="8" fill="#94A3B8"/>
</svg>
