<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="MinicovereD">
  <!--
    The Mark (ADR-0011). A J-Card, hinged: the Spine dropped two modules beside
    the Front Panel. Sixteen modules, M/H/V/Z only, no curve and no anti-alias,
